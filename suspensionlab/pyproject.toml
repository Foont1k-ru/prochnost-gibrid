[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suspensionlab"
version = "0.1.0"
description = "Подвеска.Про — расчёт кинематики автомобильной подвески (настольное приложение)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SuspensionLab" }]
dependencies = [
    "PySide6-Essentials==6.12.0",
    "numpy==2.4.6",
    "scipy==1.16.3",
    "pyqtgraph==0.13.7",
    "ezdxf==1.4.5",
    "reportlab==5.1.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "hypothesis==6.140.3",
    "ruff==0.14.3",
    "mypy==1.18.2",
    "pyinstaller==6.16.0",
]

[project.scripts]
suspensionlab = "suspensionlab.app:main"

[tool.setuptools.packages.find]
include = ["suspensionlab*"]

[tool.setuptools.package-data]
suspensionlab = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"suspensionlab/model/entities.py" = ["N815"]  # Поля схемы JSON с единицами СИ.
"suspensionlab/ui/**/*.py" = ["N815", "N802"]  # Сигналы и переопределения Qt.
