name: Диагностика жизненного цикла Qt и CAD

on:
  push:
    paths:
      - '.github/workflows/qt-cad-diagnostic.yml'
      - 'suspensionlab/diagnostics/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-native-lifecycle:
    name: '${{ matrix.os }} — ${{ matrix.revision }}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        revision: [baseline, current]
    defaults:
      run:
        working-directory: target/suspensionlab
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      DIAGNOSTIC_VARIANT: '${{ matrix.revision }}'
    steps:
      - name: Получить диагностический сценарий текущего коммита
        uses: actions/checkout@v4
        with:
          path: driver
      - name: Получить тестируемую версию
        uses: actions/checkout@v4
        with:
          ref: "${{ matrix.revision == 'baseline' && '94820368019ad7559faa68fd02191888e87c87b3' || github.sha }}"
          path: target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установить библиотеки Qt в Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Установить приложение и зависимости CAD/Qt
        run: python -m pip install -e ".[dev,cad]"
      - name: Записать точные зависимости и коммит
        shell: bash
        run: |
          mkdir -p qt-cad-diagnostics
          python -m pip freeze > qt-cad-diagnostics/pip-freeze.txt
          git rev-parse HEAD > qt-cad-diagnostics/commit.txt
      - name: Подготовить одинаковый диагностический сценарий
        shell: bash
        run: |
          mkdir -p diagnostics
          cp ../../driver/suspensionlab/diagnostics/test_qt_cad_lifecycle.py diagnostics/
          cp ../../driver/suspensionlab/diagnostics/run_qt_cad_repetitions.py diagnostics/
          cp ../../driver/suspensionlab/diagnostics/qt_dialog_gc_probe.py diagnostics/
      - name: Три отдельных процесса pytest с настоящим CAD
        shell: bash
        run: |
          export DIAGNOSTIC_SHA="$(cat qt-cad-diagnostics/commit.txt)"
          python diagnostics/run_qt_cad_repetitions.py
      - name: Сохранить журналы и версии даже при ошибке
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-cad-${{ matrix.os }}-${{ matrix.revision }}
          path: target/suspensionlab/qt-cad-diagnostics/
          if-no-files-found: warn
          retention-days: 14
