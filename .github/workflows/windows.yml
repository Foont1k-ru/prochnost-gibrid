name: Windows приёмочная сборка

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Разложить исходники (если загружен архив проекта)
        shell: bash
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Распаковываю $z"
            if command -v unzip >/dev/null 2>&1; then
              unzip -q -o "$z"
            else
              powershell -NoProfile -Command "Expand-Archive -Path '$z' -DestinationPath . -Force"
            fi
          done
          B="$(find . -name build.cmd -not -path './.github/*' -print -quit)"
          if [ -z "$B" ]; then
            echo "::error::build.cmd не найден — загрузите архив prochnost-gibrid-win.zip в корень репозитория"
            exit 1
          fi
          echo "Найден build.cmd: $B"
          echo "SRC=$(dirname "$B")" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Важно: окружение MSVC здесь НЕ поднимаем. Генератору "Visual Studio 17 2022"
      # оно не нужно, а переменная VSINSTALLDIR от таких действий ломает поиск
      # установленной VS (проверено: прогон от 12.11.2026 упал именно на этом).
      - name: Диагностика окружения
        shell: cmd
        run: |
          cmake --version
          echo --- установленные Visual Studio ---
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property displayName,installationVersion,installationPath
          echo --- каталоги ---
          dir "%ProgramFiles%\Microsoft Visual Studio" 2>nul

      - name: Сборка (build.cmd Release)
        id: buildcmd
        continue-on-error: true
        shell: cmd
        working-directory: ${{ env.SRC }}
        run: |
          call build.cmd Release > win_stand_log.txt 2>&1
          set RC=%ERRORLEVEL%
          type win_stand_log.txt
          exit /b %RC%

      # Запасной путь: если генератор VS почему-то не найдётся — собираем тем же
      # MSVC, но через Ninja (здесь окружение как раз нужно). Результат подшивается
      # в тот же журнал отдельным блоком.
      - name: Окружение MSVC для запасного пути
        if: steps.buildcmd.outcome == 'failure'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Запасная сборка (Ninja + MSVC)
        if: steps.buildcmd.outcome == 'failure'
        shell: cmd
        working-directory: ${{ env.SRC }}
        run: |
          echo. >> win_stand_log.txt
          echo === ЗАПАСНОЙ ПУТЬ: Ninja + MSVC === >> win_stand_log.txt
          cmake -S . -B build/ninja -G Ninja -DCMAKE_BUILD_TYPE=Release -DPGIB_BUILD_UI=ON >> win_stand_log.txt 2>&1 || goto bad
          cmake --build build/ninja >> win_stand_log.txt 2>&1 || goto bad
          build\ninja\pgib_tests.exe >> win_stand_log.txt 2>&1 || goto bad
          echo === ЗАПАСНОЙ ПУТЬ ПРОШЁЛ === >> win_stand_log.txt
          type win_stand_log.txt
          exit /b 0
          :bad
          echo === ЗАПАСНОЙ ПУТЬ ПРОВАЛЕН === >> win_stand_log.txt
          type win_stand_log.txt
          exit /b 1

      - name: Итог
        if: always()
        shell: bash
        run: |
          echo "## Итог" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.buildcmd.outcome }}" = "success" ]; then
            echo "build.cmd на Windows: **УСПЕХ**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build.cmd на Windows: **ПРОВАЛ** (подробности в win_stand_log.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Сохранить журнал и результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stand
          path: |
            ${{ env.SRC }}/win_stand_log.txt
            ${{ env.SRC }}/out/**
          if-no-files-found: warn
