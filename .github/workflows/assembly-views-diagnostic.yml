name: Диагностика видов сборки
on: [push]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -e 'suspensionlab[dev]'
      - name: Целевые тесты с ограничением времени и трассировкой
        working-directory: suspensionlab
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          path = Path('diagnostic-console.txt')
          with path.open('wb') as out:
              try:
                  result = subprocess.run([sys.executable, '-m', 'pytest', '-vv', '-o', 'faulthandler_timeout=20', 'tests/test_scheme_arm_assembly_ui.py', 'tests/test_scheme_assembly_views.py'], stdout=out, stderr=subprocess.STDOUT, timeout=120)
                  code = result.returncode
              except subprocess.TimeoutExpired:
                  code = 124
          text = path.read_text(encoding='utf-8', errors='replace')
          print(text)
          if code:
              tail = text[-20000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Assembly views diagnostic::' + tail)
          sys.exit(code)
          PY
