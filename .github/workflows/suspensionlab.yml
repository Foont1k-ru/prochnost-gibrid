name: Подвеска.Про — тесты Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_experimental:
        description: Явно создать пробную Windows-сборку
        required: false
        type: boolean
        default: false
      diagnostic_run_id:
        description: ID прогона с отчётом для диагностики (необязательно)
        required: false
        type: string
      diagnostic_artifact:
        description: Отчёт для диагностики
        required: false
        type: choice
        default: windows
        options:
          - windows
          - python311-ubuntu-latest
          - python311-windows-latest

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Python и Qt на Windows
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: suspensionlab
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: suspensionlab/pyproject.toml
      - name: Установить приложение и зависимости тестов
        run: python -m pip install -e ".[dev]"
      - name: Проверить стиль
        run: python -m ruff check .
      - name: Проверить типы
        run: python -m mypy suspensionlab
      - name: Запустить тесты, включая Qt
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Показать ошибки тестов в аннотациях
        if: failure()
        run: python scripts/annotate_pytest.py test-results.xml
      - name: Сохранить отчёт тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suspensionlab-windows-test-results
          path: suspensionlab/test-results.xml
          if-no-files-found: warn

  python311-compatibility:
    name: Python 3.11 / Qt — ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic_run_id == ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: suspensionlab
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: suspensionlab/pyproject.toml
      - name: Установить системные библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Установить зависимости
        run: python -m pip install -e ".[dev,cad]"
      - name: Проверить зависимости
        run: python -m pip check
      - name: Полный набор тестов и отдельные процессы Qt (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          PYTHONFAULTHANDLER=1 python -u -m pytest -v --ignore=tests/test_weldment_3d_integration.py --junitxml=python311-results.xml > python311-console.txt 2>&1
          result=$?
          cat python311-console.txt
          if [ "$result" -ne 0 ]; then
            python -c "from pathlib import Path; t=Path('python311-console.txt').read_text(encoding='utf-8', errors='replace')[-12000:]; print('::error title=Python test output::'+t.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'))"
          fi
          exit "$result"
      # Run CAD+Qt integration in a fresh interpreter: the monolithic Linux
      # suite intermittently segfaults during Qt garbage collection. This is
      # test-process isolation, not proof that the underlying crash is fixed.
      - name: CAD+Qt интеграция в отдельном процессе (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          PYTHONFAULTHANDLER=1 python -u -m pytest -v tests/test_weldment_3d_integration.py --junitxml=python311-integration-results.xml > python311-integration-console.txt 2>&1
          result=$?
          cat python311-integration-console.txt
          if [ "$result" -ne 0 ]; then
            python -c "from pathlib import Path; t=Path('python311-integration-console.txt').read_text(encoding='utf-8', errors='replace')[-12000:]; print('::error title=Python integration output::'+t.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'))"
          fi
          exit "$result"
      - name: Полный набор тестов и отдельные процессы Qt (Windows)
        if: runner.os == 'Windows'
        run: python scripts/run_pytest_with_diagnostics.py -v --junitxml=python311-results.xml
      - name: Показать ошибки Python 3.11 в аннотациях
        if: failure()
        run: python scripts/annotate_pytest.py python311-results.xml
      - name: Показать ошибки отдельной CAD+Qt интеграции
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: if [ -f python311-integration-results.xml ]; then python scripts/annotate_pytest.py python311-integration-results.xml; fi
      - name: Проверить исходный запуск и таблицу в smoke-тесте
        run: python packaging_entry.py --packaging-check python311-smoke.txt
      - name: Сохранить отчёт тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suspensionlab-python311-${{ matrix.os }}-test-results
          path: |
            suspensionlab/python311-results.xml
            suspensionlab/python311-integration-results.xml
            suspensionlab/python311-console.txt
            suspensionlab/python311-integration-console.txt
          if-no-files-found: warn

  package:
    name: Пробная сборка приложения Windows
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_experimental == true && inputs.diagnostic_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: suspensionlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости и PyInstaller
        run: python -m pip install ".[cad]" pyinstaller==6.16.0
      - name: Собрать приложение с ресурсами и CAD-ядром
        shell: pwsh
        run: |
          $ocpLibs = python -c "from importlib.metadata import distribution; print(distribution('cadquery-ocp-novtk').locate_file('cadquery_ocp_novtk.libs'))"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ocpLibs)) { throw 'Не найдены библиотеки CAD' }
          python -m PyInstaller --noconfirm --clean --windowed --name SuspensionLab `
            --collect-all OCP --add-binary "$ocpLibs\*.dll;cadquery_ocp_novtk.libs" `
            --add-data "suspensionlab/resources;suspensionlab/resources" packaging_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверить собранное приложение вне каталога исходников
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: |
          $exe = (Resolve-Path 'dist/SuspensionLab/SuspensionLab.exe').Path
          $isolated = Join-Path $env:RUNNER_TEMP 'suspensionlab-package-check'
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          $env:APPDATA = $isolated
          foreach ($check in @('--packaging-check', '--packaging-startup-check', '--packaging-cad-check')) {
            $report = Join-Path $isolated "$check.txt"
            Remove-Item $report -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -ArgumentList @($check, "`"$report`"") -WorkingDirectory $isolated -PassThru
            if (-not $process.WaitForExit(150000)) {
              $process.Kill()
              throw "Превышено время проверки $check"
            }
            if (Test-Path $report) { Get-Content -Path $report -Encoding utf8 }
            if ($process.ExitCode -ne 0 -or -not (Test-Path $report) -or (Get-Content -Raw -Encoding utf8 $report).Trim() -ne 'OK') {
              $detail = if (Test-Path $report) { (Get-Content -Raw -Encoding utf8 $report) } else { 'Нет отчёта' }
              $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::Проверка ${check}, код $($process.ExitCode): $detail"
              throw "Ошибка проверки ${check}: $($process.ExitCode)"
            }
          }
      - name: Подготовить файлы для ознакомления
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -Path dist/SuspensionLab -Destination package/SuspensionLab -Recurse
          Copy-Item PACKAGE_README_RU.txt package/ПРОЧТИ-МЕНЯ.txt
          "Commit: $env:GITHUB_SHA`nRun: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content package/BUILD-INFO.txt -Encoding utf8
      - name: Сохранить пробную сборку
        uses: actions/upload-artifact@v4
        with:
          name: suspensionlab-windows-experimental
          path: suspensionlab/package/
          if-no-files-found: error
          retention-days: 14

  diagnostic:
    name: Диагностика сохранённого JUnit
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_run_id != ''
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: suspensionlab
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.diagnostic_run_id }}
      REPORT_KIND: ${{ inputs.diagnostic_artifact }}
    steps:
      - uses: actions/checkout@v4
      - name: Прочитать результаты указанного прогона
        shell: pwsh
        run: |
          if ($env:RUN_ID -notmatch '^\d+$') { throw "Invalid run ID" }
          if ($env:REPORT_KIND -eq 'windows' -or $env:REPORT_KIND -eq '') {
            $artifact = 'suspensionlab-windows-test-results'
            $report = 'diagnostic-report/test-results.xml'
          } elseif ($env:REPORT_KIND -in @('python311-ubuntu-latest', 'python311-windows-latest')) {
            $artifact = "suspensionlab-$env:REPORT_KIND-test-results"
            $report = 'diagnostic-report/python311-results.xml'
          } else { throw 'Invalid report type' }
          gh run download $env:RUN_ID --name $artifact --dir diagnostic-report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $report)) {
            # A killed or timed-out pytest cannot write JUnit. Expose the saved
            # console tail as a notice, not as proof of a successful test.
            $console = 'diagnostic-report/python311-console.txt'
            if (-not (Test-Path $console)) { throw 'Report and console missing' }
            $text = Get-Content -Raw -Encoding utf8 $console
            if (-not $text) { throw 'Report missing and console empty' }
            # GitHub truncates annotations at 4096 characters; preserve the end.
            $tail = $text.Substring([Math]::Max(0, $text.Length - 2500))
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::warning title=JUnit отсутствует; хвост консоли::$tail"
            exit 0
          }
          python scripts/annotate_pytest.py $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
