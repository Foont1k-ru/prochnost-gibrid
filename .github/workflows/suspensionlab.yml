name: Подвеска.Про — тесты Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_run_id:
        description: ID прогона с отчётом для диагностики (необязательно)
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Python и Qt на Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: suspensionlab
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: suspensionlab/pyproject.toml
      - name: Установить приложение и зависимости тестов
        run: python -m pip install -e ".[dev]"
      - name: Проверить стиль
        run: python -m ruff check .
      - name: Проверить типы
        run: python -m mypy suspensionlab
      - name: Запустить тесты, включая Qt
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Показать ошибки тестов в аннотациях
        if: failure()
        run: python scripts/annotate_pytest.py test-results.xml
      - name: Сохранить отчёт тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suspensionlab-windows-test-results
          path: suspensionlab/test-results.xml
          if-no-files-found: warn

  package:
    name: Пробная сборка приложения Windows
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: suspensionlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости и PyInstaller
        run: python -m pip install . pyinstaller==6.16.0
      - name: Собрать приложение с ресурсами
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --name SuspensionLab
          --add-data "suspensionlab/resources;suspensionlab/resources" packaging_entry.py
      - name: Проверить собранное приложение вне каталога исходников
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: |
          $exe = (Resolve-Path 'dist/SuspensionLab/SuspensionLab.exe').Path
          $isolated = Join-Path $env:RUNNER_TEMP 'suspensionlab-package-check'
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          $env:APPDATA = $isolated
          foreach ($check in @('--packaging-check', '--packaging-startup-check')) {
            $report = Join-Path $isolated "$check.txt"
            Remove-Item $report -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -ArgumentList @($check, "`"$report`"") -WorkingDirectory $isolated -PassThru
            if (-not $process.WaitForExit(90000)) {
              $process.Kill()
              throw "Превышено время проверки $check"
            }
            if (Test-Path $report) { Get-Content -Path $report -Encoding utf8 }
            if ($process.ExitCode -ne 0 -or -not (Test-Path $report) -or (Get-Content -Raw -Encoding utf8 $report).Trim() -ne 'OK') {
              throw "Ошибка проверки ${check}: $($process.ExitCode)"
            }
          }
      - name: Подготовить файлы для ознакомления
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -Path dist/SuspensionLab -Destination package/SuspensionLab -Recurse
          Copy-Item PACKAGE_README_RU.txt package/ПРОЧТИ-МЕНЯ.txt
          "Commit: $env:GITHUB_SHA`nRun: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content package/BUILD-INFO.txt -Encoding utf8
      - name: Сохранить пробную сборку
        uses: actions/upload-artifact@v4
        with:
          name: suspensionlab-windows-experimental
          path: suspensionlab/package/
          if-no-files-found: error
          retention-days: 14

  diagnostic:
    name: Диагностика сохранённого JUnit
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_run_id != ''
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: suspensionlab
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.diagnostic_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Прочитать результаты указанного прогона
        shell: pwsh
        run: |
          if ($env:RUN_ID -notmatch '^\d+$') { throw "Invalid run ID" }
          gh run download $env:RUN_ID --name suspensionlab-windows-test-results --dir diagnostic-report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/annotate_pytest.py diagnostic-report/test-results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
