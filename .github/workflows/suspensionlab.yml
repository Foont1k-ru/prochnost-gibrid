name: Подвеска.Про — тесты Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_run_id:
        description: ID прогона с отчётом для диагностики (необязательно)
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Python и Qt на Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: suspensionlab
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: suspensionlab/pyproject.toml
      - name: Установить приложение и зависимости тестов
        run: python -m pip install -e ".[dev]"
      - name: Проверить стиль
        run: python -m ruff check .
      - name: Проверить типы
        run: python -m mypy suspensionlab
      - name: Запустить тесты, включая Qt
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Показать ошибки тестов в аннотациях
        if: failure()
        run: python scripts/annotate_pytest.py test-results.xml
      - name: Сохранить отчёт тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suspensionlab-windows-test-results
          path: suspensionlab/test-results.xml
          if-no-files-found: warn

  diagnostic:
    name: Диагностика сохранённого JUnit
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_run_id != ''
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: suspensionlab
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.diagnostic_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Прочитать результаты указанного прогона
        shell: pwsh
        run: |
          if ($env:RUN_ID -notmatch '^\d+$') { throw "Invalid run ID" }
          gh run download $env:RUN_ID --name suspensionlab-windows-test-results --dir diagnostic-report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/annotate_pytest.py diagnostic-report/test-results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
