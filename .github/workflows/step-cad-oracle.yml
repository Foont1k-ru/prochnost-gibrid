name: STEP — независимый CAD-эталон

on:
  push:
    paths:
      - 'suspensionlab/suspensionlab/core/spatial_transform.py'
      - 'suspensionlab/suspensionlab/core/step_*.py'
      - 'suspensionlab/tests/test_cad_oracle.py'
      - 'suspensionlab/tests/test_step_cad_assembly.py'
      - '.github/workflows/step-cad-oracle.yml'
  pull_request:
    paths:
      - 'suspensionlab/suspensionlab/core/spatial_transform.py'
      - 'suspensionlab/suspensionlab/core/step_*.py'
      - 'suspensionlab/tests/test_cad_oracle.py'
      - 'suspensionlab/tests/test_step_cad_assembly.py'
      - '.github/workflows/step-cad-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    name: Open CASCADE — сравнение геометрических преобразований
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: suspensionlab
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить независимое CAD-ядро и тестовые зависимости
        run: python -m pip install numpy==2.4.6 pytest==9.2.0 cadquery-ocp==8.0.1.1.0
      - name: Убедиться, что CAD-ядро загружается
        run: python -c "from OCP.gp import gp_Ax3, gp_Pnt, gp_Trsf; print('Open CASCADE ready')"
      - name: Сверить преобразования и искусственную STEP-сборку
        run: python -m pytest -q tests/test_cad_oracle.py tests/test_step_cad_assembly.py --junitxml=cad-results.xml
      - name: Показать ошибки тестов в аннотациях
        if: failure()
        run: python scripts/annotate_pytest.py cad-results.xml
